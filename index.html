<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferry Rush</title>
<meta name="description" content="Ferry Rush: a relaxing color puzzle. Sort the cars and fill the ferries. Free on Google Play.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#f3f8fa;--fg:#14303a;--muted:#4f6b75;--accent:#0e6d8c;--card:#ffffff;--line:#d5e4ea}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b21;--fg:#e4f0f4;--muted:#9db5bd;--accent:#4fc0e0;--card:#132830;--line:#22414c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Nunito,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 20px}
h1{font:600 clamp(40px,9vw,64px)/1 Fredoka,system-ui,sans-serif;margin:0 0 12px;color:var(--accent)}
p{margin:0 0 16px}
.lead{font-size:20px}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:10px;margin:8px 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.card h2{font:600 22px Fredoka,system-ui,sans-serif;margin:0 0 8px}
a{color:var(--accent)}
footer{margin-top:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Ferry Rush</h1>
  <p class="lead">Sort the cars by color and fill the ferries. A relaxing puzzle game with no timer and no stress. Plays offline.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.ferryrushgame.app">Get it on Google Play</a>
  <div class="card">
    <h2>Support</h2>
    <p>Questions, bugs or ideas? Write to <a href="mailto:emilnjulsgaard2@gmail.com">emilnjulsgaard2@gmail.com</a>.</p>
    <p><a href="privacy.html">Privacy policy</a></p>
  </div>
  <footer>&copy; 2026 EJulle</footer>
</main>
</body>
</html>
